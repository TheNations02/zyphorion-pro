<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zyphorion PRO — Tu clave</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #f8f4f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: rgba(25,8,12,0.88);
    border: 1px solid rgba(220,38,38,0.15);
    border-radius: 16px;
    padding: 40px 36px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 40px rgba(220,38,38,0.1), 0 0 80px rgba(220,38,38,0.05);
  }
  .logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    text-shadow: 0 0 18px rgba(220,38,38,0.7);
    margin-bottom: 6px;
  }
  .logo span { color: #dc2626; }
  .sub { font-size: 12px; color: #b08888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 24px; }
  .check {
    width: 56px; height: 56px;
    background: rgba(34,197,94,0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }
  .check svg { width: 28px; height: 28px; stroke: #22c55e; }
  h1 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .desc { font-size: 13px; color: #b08888; margin-bottom: 24px; line-height: 1.5; }
  .key-box {
    background: #0f0f16;
    border: 1px solid rgba(220,38,38,0.2);
    border-radius: 10px;
    padding: 16px;
    font-family: 'Courier New', monospace;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #f59e0b;
    text-shadow: 0 0 10px rgba(245,158,11,0.3);
    margin-bottom: 20px;
    user-select: all;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #000;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { transform: scale(1.04); box-shadow: 0 0 20px rgba(245,158,11,0.5); }
  .btn.copied { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .timer {
    font-size: 11px;
    color: #785858;
    margin-top: 20px;
  }
  .timer strong { color: #b08888; }
  .footer {
    margin-top: 24px;
    font-size: 10px;
    color: #785858;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">ZYPHORION <span>PRO</span></div>
  <div class="sub">Clave de activación</div>

  <div class="check">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>

  <h1>¡Anuncios completados!</h1>
  <p class="desc">Copiá esta clave y pegala en la extensión para activar Zyphorion PRO por 24 horas.</p>

  <div class="key-box" id="keyDisplay">Cargando...</div>

  <button class="btn" id="copyBtn">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
      <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
    </svg>
    <span id="copyLabel">Copiar clave</span>
  </button>

  <div class="timer">⏱ Vence en <strong id="countdown">15:00</strong></div>

  <div class="footer">
    Pegala en Ajustes → Activar PRO en la extensión
  </div>
</div>

<script>
(function() {
  // ─── Key generation ───
  function crc16(data) {
    var crc = 0xFFFF;
    for (var i = 0; i < data.length; i++) {
      crc ^= data[i];
      for (var j = 0; j < 8; j++) {
        if (crc & 1) { crc = (crc >>> 1) ^ 0xA001; }
        else { crc = crc >>> 1; }
      }
    }
    return crc & 0xFFFF;
  }

  function generateKey() {
    var now = Math.floor(Date.now() / 60000);
    var rand = Math.floor(Math.random() * 65536);
    var buf = new Uint8Array(4);
    buf[0] = (now >> 8) & 0xFF;
    buf[1] = now & 0xFF;
    buf[2] = (rand >> 8) & 0xFF;
    buf[3] = rand & 0xFF;
    var cksum = crc16(buf);
    var reserved = 0x0000;
    var parts = [
      ('0000' + now.toString(16).toUpperCase()).slice(-4),
      ('0000' + rand.toString(16).toUpperCase()).slice(-4),
      ('0000' + cksum.toString(16).toUpperCase()).slice(-4),
      ('0000' + reserved.toString(16).toUpperCase()).slice(-4)
    ];
    return parts.join('-');
  }

  var key = generateKey();
  var expiresMs = 15 * 60 * 1000;
  var startTime = Date.now();
  var keyEl = document.getElementById('keyDisplay');
  var copyBtn = document.getElementById('copyBtn');
  var copyLabel = document.getElementById('copyLabel');
  var countdownEl = document.getElementById('countdown');

  keyEl.textContent = key;

  // ─── Countdown ───
  function updateCountdown() {
    var remaining = Math.max(0, expiresMs - (Date.now() - startTime));
    var min = Math.floor(remaining / 60000);
    var sec = Math.floor((remaining % 60000) / 1000);
    countdownEl.textContent = ('0' + min).slice(-2) + ':' + ('0' + sec).slice(-2);
    if (remaining <= 0) {
      countdownEl.textContent = 'EXPIRADA';
      countdownEl.style.color = '#ef4444';
    }
  }
  setInterval(updateCountdown, 1000);
  updateCountdown();

  // ─── Copy ───
  function getKeyParam() {
    var params = new URLSearchParams(window.location.search);
    return params.get('key');
  }

  var urlKey = getKeyParam();
  if (urlKey && /^[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}$/.test(urlKey)) {
    key = urlKey;
    keyEl.textContent = key;
  }

  copyBtn.addEventListener('click', async function() {
    try {
      await navigator.clipboard.writeText(key);
      copyBtn.classList.add('copied');
      copyLabel.textContent = '✓ Copiada';
      setTimeout(function() {
        copyBtn.classList.remove('copied');
        copyLabel.textContent = 'Copiar clave';
      }, 2500);
    } catch (_) {
      // fallback
      var ta = document.createElement('textarea');
      ta.value = key;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      copyLabel.textContent = '✓ Copiada';
      setTimeout(function() { copyLabel.textContent = 'Copiar clave'; }, 2500);
    }
  });
})();
</script>
</body>
</html>
